name: Bug Report
description: Report an issue or unexpected behavior in Raxo Rehearse
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please do not upload production databases, customer records, or credentials.
  - type: input
    id: versions
    attributes:
      label: Environment & Versions
      description: Python version (`python --version`) and SQLite version (`python -c "import sqlite3; print(sqlite3.sqlite_version)"`).
      placeholder: "e.g. Python 3.12.14, SQLite 3.40.1 on Linux"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Fictional Reproduction
      description: Provide a minimal SQL schema, migration SQL, and checks JSON reproducing the behavior with fictional data.
      placeholder: "CREATE TABLE t (id INT PRIMARY KEY, val TEXT)..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What findings, status, or exit code did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What findings, status, or exit code occurred?
    validations:
      required: true
